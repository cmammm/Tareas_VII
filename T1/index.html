<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSON corporal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>ᒎᔕᗝᑎ ᑕᗝᖇᑭᗝᖇᗩᒪ</h1>
    <p>El archivo JSON dice que:</p>
    <p><span id="accion"></span></p>

    <script>
        
        function aleatorio(max) {
            return Math.floor(Math.random() * max);
        }

        fetch('hola.json')
        .then(response => response.json())
        .then(json => {
            let iAccion = aleatorio(json.acciones.length);
            let iParte = aleatorio(json.partes.length);
            let iLado = aleatorio(json.lado.length);

            document.getElementById("accion").innerHTML =
                json.acciones[iAccion] + " tu " + json.partes[iParte] + " hacia la " + json.lado[iLado];

            console.log(json);
        })
        .catch(error => {
            console.error("Error al cargar el archivo JSON:", error);
            document.getElementById("accion").innerHTML = "No se pudo cargar la instrucción.";
        });
    </script>
</body>
</html>
